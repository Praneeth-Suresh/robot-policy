[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-streaming-policy"
version = "0.1.0"
description = "Reusable tooling and guidance components for robot-policy experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Puming (Oscar) Jiang" },
]
keywords = [
  "robotics",
  "policy-learning",
  "stochastic-interpolant",
  "streaming-policy",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
pusht = [
  "diffusers==0.36.0",
  "gym==0.26.2",
  "imageio==2.37.2",
  "ipython==8.37.0",
  "numpy==1.26.4",
  "opencv-python==4.9.0.80",
  "pandas==2.3.3",
  "pygame==2.6.1",
  "pymunk==7.2.0",
  "scikit-image==0.25.2",
  "shapely==2.1.2",
  "torch==2.9.1",
  "tqdm==4.67.1",
  "zarr==2.18.3",
]
robomimic = [
  "diffusers==0.36.0",
  "gym==0.26.2",
  "h5py==3.15.1",
  "imageio==2.37.2",
  "imageio-ffmpeg==0.6.0",
  "llvmlite==0.46.0",
  "matplotlib==3.10.8",
  "mujoco==3.4.0",
  "numpy==1.26.4",
  "opencv-python==4.9.0.80",
  "pandas==2.3.3",
  "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@d309eaecc18acf4152a830a895a6984b8ac71b05",
  "robosuite==1.5.2",
  "scipy==1.15.3",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "tqdm==4.67.1",
]

dev = [
  "jsonschema>=4.21",
  "mypy>=1.10",
  "ruff>=0.5",
  "vulture>=2.11",
]

[project.scripts]
gsp = "guided_streaming_policy.cli:main"

[project.entry-points."gsp_lab.tasks"]
pusht = "guided_streaming_policy.lab.tasks.pusht.adapter:PushTTask"

[tool.setuptools.packages.find]
include = ["guided_streaming_policy*"]

[tool.uv]
# The current Robomimic source declares older diffusers and huggingface-hub
# pins that conflict with this project's tested model stack. Its APIs used here
# remain compatible with the newer versions, so keep the shared versions.
override-dependencies = [
  "diffusers==0.36.0",
  "huggingface-hub==1.33.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "ARG", "T20", "ERA", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true
files = ["guided_streaming_policy/lab"]

[tool.vulture]
paths = ["guided_streaming_policy/lab"]
min_confidence = 80

[tool.setuptools.package-data]
"guided_streaming_policy.lab" = ["assets/*.css", "assets/*.js", "assets/*.svg"]
