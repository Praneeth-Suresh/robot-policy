[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-streaming-policy"
version = "0.1.0"
description = "Lightweight repo tooling for the Guided Streaming Stochastic Interpolant Policy project."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Puming (Oscar) Jiang" },
]
keywords = [
  "robotics",
  "policy-learning",
  "stochastic-interpolant",
  "streaming-policy",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
pusht = [
  "diffusers==0.36.0",
  "gym==0.26.2",
  "imageio==2.37.2",
  "ipython==8.37.0",
  "numpy==2.2.6",
  "opencv-python==4.12.0.88",
  "pandas==2.3.3",
  "pygame==2.6.1",
  "pymunk==7.2.0",
  "scikit-image==0.25.2",
  "shapely==2.1.2",
  "torch==2.9.1",
  "tqdm==4.67.1",
  "zarr==2.18.3",
]

[project.scripts]
gsp = "guided_streaming_policy.cli:main"

[tool.setuptools.packages.find]
include = ["guided_streaming_policy*"]
